<div style="background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin-bottom: 30px;">
  <h3 style="color: #2980b9; margin-top: 0;">
    <!--@if (idEdicion > 0) {--> <!--DIR9 migracion a firebase-->
    @if (idEdicion !== '') {
      ✏️ Editando Incidente #{{ idEdicion }}
    } @else {
      Abrir nuevo incidente
    }
  </h3>

  <div style="margin-bottom: 20px; background-color: #ecf0f1; padding: 10px; border-radius: 4px; border-left: 4px solid #3498db;">
    <span style="font-weight: bold; color: #7f8c8d;">Solicitante:</span>
    <span style="font-size: 1.1em; font-weight: bold; margin-left: 10px; color: #2c3e50;">{{ usuarioActual }}</span>
  </div>

  <form [formGroup]="ticketFormulario" (ngSubmit)="guardarTicket()"><!--con forgroup le digo al form que tome ticketFormulario, que a su vez le di valor ngsubmit y que vaya a buscar nuestra funcion crearTicket-->

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Título: *</label>
      <input type="text" formControlName="titulo" placeholder="Ej: Falla en sistema" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="display: flex; gap: 15px; margin-bottom: 15px;">

          <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tipo:</label>
        <select formControlName="tipo" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: white;">
          <option value="Incidente">Incidente</option>
          <option value="Solicitud">Solicitud</option>
        </select>
      </div>

      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Asignación:</label>
        <select formControlName="asignacion" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: white;">
          <option value="Soporte Tecnico">Soporte Técnico</option>
          <option value="Aplicaciones">Aplicaciones</option>
          <option value="Desarrollo">Desarrollo</option>
        </select>
      </div>

      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Categoría:</label>
        <select formControlName="categoria" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: white;">
          <option value="Notebook">Notebook</option>
          <option value="Pc-Escritorio">Pc-Escritorio</option>
          <option value="Impresora">Impresora</option>
          <option value="MercadoTrader">MercadoTrader</option>
          <option value="SysPLyFT">SysPLyFT</option>
          <option value="SysCoreBancario">SysCoreBancario</option>
        </select>
      </div>
      
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descripción del problema lo mas detallado posible: *</label>
      <textarea formControlName="descripcion" placeholder="Mínimo 10 caracteres..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 80px;"></textarea>
    </div>

    <!--#DIR11 y #DIR12 forma parte de la mejora para adjuntar imagenes-->
    <!--<div style="margin-bottom: 20px; background-color: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px dashed #bdc3c7;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50;">📸 Adjuntar Captura (Opcional):</label>
        <input type="file" accept="image/*" (change)="seleccionarImagen($event)" style="width: 100%;">
      <small style="color: #7f8c8d; display: block; margin-top: 5px;">Formato recomendado: .PNG o .JPG</small>
    </div>-->
    <!--#DIR20 MEJORA DEL #DIR11 Y #DIR12-->
    <!--#DIR11 y #DIR12 forma parte de la mejora para adjuntar imagenes-->
    <div style="margin-bottom: 20px; background-color: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px dashed #bdc3c7;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50;">📸 Adjuntar Captura (Opcional):</label>
      
      <!-- Si hay una imagen actual, la mostramos con la opcion de eliminarla -->
      @if (imagenActual !== '') {
        <div style="margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; background: white; border-radius: 4px;">
          <p style="margin-top: 0; font-size: 0.9em; color: #7f8c8d;">Imagen actual adjunta:</p>
          <img [src]="imagenActual" alt="Evidencia actual" style="max-width: 150px; border-radius: 4px; display: block; margin-bottom: 10px;">
          <button type="button" (click)="eliminarImagenActual()" style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-weight: bold;">
            🗑️ Eliminar esta imagen
          </button>
        </div>
      }

      <input type="file" accept="image/*" (change)="seleccionarImagen($event)" style="width: 100%;">
      <small style="color: #7f8c8d; display: block; margin-top: 5px;">Formato recomendado: .PNG o .JPG (Al elegir un archivo nuevo, reemplazará al actual)</small>
    </div>

    <button type="submit" [disabled]="ticketFormulario.invalid" 
            [style.background-color]="obtenerColorBoton()"
            style="color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      <!--@if (idEdicion > 0) {--> <!--DIR9 migracion a firebase-->
      @if (idEdicion !== '') {  
        💾 Guardar Cambios
      } @else {
        ➕ Crear Ticket
      }
    </button>
    <!--Cancelar la edicion-->
      <button type="button" (click)="cancelar()" style="background-color: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        ❌ Cancelar
      </button>

  </form>
  

</div>
