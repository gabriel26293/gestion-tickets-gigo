<div style="background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin-bottom: 30px;">
  <h3 style="color: #2980b9; margin-top: 0;">
    @if (idEdicion > 0) {
      ✏️ Editando Incidente #{{ idEdicion }}
    } @else {
      Abrir nuevo incidente
    }
  </h3>

  <form [formGroup]="ticketFormulario" (ngSubmit)="guardarTicket()"><!--con forgroup le digo al form que tome ticketForm, que a su vez le di valor ngsubmit y que vaya a buscar nuestra funcion crearTicket-->

	<!--mas adelante veremos si es necesario ingresar solicitante-->
    <div style="margin-bottom: 15px;"> <!--vinculo formControlName con formGroup y le enchufo con el control "solicitante" repetimos en los demas-->
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Solicitante (Usuario): *</label>
      <input type="text" formControlName="solicitante" placeholder="Ej: Juan Pérez" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Elemento asociado (Hardware/Software):</label>
        <input type="text" formControlName="equipo" placeholder="Ej: PC-Ventas-01 / Impresora HP" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descripcion del problema lo mas detallado posible: *</label>
      <textarea formControlName="descripcion" placeholder="Mínimo 10 caracteres..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 80px;"></textarea>
    </div>

    <button type="submit" [disabled]="ticketFormulario.invalid" 
            [style.background-color]="obtenerColorBoton()"
            style="color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      @if (idEdicion > 0) {
        💾 Guardar Cambios
      } @else {
        ➕ Crear Ticket
      }
    </button>
  </form>
  

</div>
