<div style="padding: 20px; font-family: Arial, sans-serif; background-color: #f4f7f6; min-height: 100vh;">
  
  <h1 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px;">
    {{ tituloSistema }}
  </h1>

  <div style="background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin-bottom: 30px;">
    
    <h3 style="color: #2980b9; margin-top: 0;">Abrir nuevo incidente</h3>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Solicitante (Usuario):</label>
      <input type="text" [(ngModel)]="nuevoSolicitante" placeholder="Ej: Juan Pérez" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Elemento asociado (Hardware/Software):</label>
      <input type="text" [(ngModel)]="nuevoEquipo" placeholder="Ej: PC-Ventas-01 / Impresora HP" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descripción del problema:</label>
      <textarea [(ngModel)]="nuevaDescripcion" placeholder="Describa el error o la solicitud..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; height: 80px;"></textarea>
    </div>

    <button (click)="crearTicket()" style="background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      + Crear Ticket
    </button>
  </div>

  <p style="color: #7f8c8d;">Total de incidentes registrados: {{ listaTicket.length }}</p>

</div>
