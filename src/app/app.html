<div style="display: flex; min-height: 100vh; font-family: Arial, sans-serif; margin: 0;">
  
  @if (enrutador.url !== '/login') {
    <div style="width: 250px; background-color: #2c3e50; color: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1);">
      <h2 style="border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0;">Gigo - Gestion de Incidente</h2>
      
      <ul style="list-style-type: none; padding: 0; margin-top: 30px;">
        <li style="margin-bottom: 20px;">
          <a routerLink="/incidentes" style="color: white; text-decoration: none; font-size: 1.1em; cursor: pointer; display: block; padding: 10px; background-color: #34495e; border-radius: 4px;">
            📋 Ver Incidentes
          </a>
        </li>
        <li>
          <a routerLink="/nuevo" style="color: white; text-decoration: none; font-size: 1.1em; cursor: pointer; display: block; padding: 10px; background-color: #34495e; border-radius: 4px;">
            ➕ Nuevo Ticket
          </a>
        </li>
          <li style="margin-top: 50px; border-top: 1px solid #34495e; padding-top: 20px;">
          <a (click)="cerrarSesion()" style="color: #e74c3c; text-decoration: none; font-size: 1em; cursor: pointer; display: block; padding: 10px; background-color: #1a252f; border-radius: 4px; font-weight: bold; text-align: center;">
            🚪 Cerrar Sesión
          </a>
        </li>
        
      </ul>
    </div>
  }

  <div style="flex-grow: 1; background-color: #f4f7f6; padding: 30px;">
    
    <router-outlet></router-outlet> 
    
  </div>

</div>
