<div style="background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 100px auto; font-family: Arial, sans-serif;">
  
  <h3 style="color: #2c3e50; margin-top: 0; margin-bottom: 30px; text-align: center; font-size: 1.6em;">Iniciar Sesion</h3>
  
  <div style="margin-bottom: 25px;">
    <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 1.1em; color: #34495e;">Usuario:</label>
    <input type="text" [(ngModel)]="usuarioInput" placeholder="Ej: administrador o usuario" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em;">
  </div>

  <div style="margin-bottom: 35px;">
    <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 1.1em; color: #34495e;">Contrasena:</label>
    <input type="password" [(ngModel)]="passInput" placeholder="********" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em;">
  </div>

  <button (click)="ingresar()" style="width: 100%; background-color: #3498db; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em;">
    Ingresar
  </button>
  
</div>
