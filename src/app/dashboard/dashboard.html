<!--#DIR22 para dibujar el tablero/dashboard-->


<div class="dashboard-container">
  <h2 class="dashboard-title">
    📈 Dashboard Analitico
  </h2>

  <!-- Tarjetas de resumen rapido (KPIs) -->
  <div class="kpi-container">
    
    <div class="kpi-card kpi-total">
      <h3 class="kpi-title">Total de Incidentes</h3>
      <p class="kpi-value">{{ totalTickets }}</p>
    </div>
    
    <div class="kpi-card kpi-abiertos">
      <h3 class="kpi-title">Tickets Abiertos</h3>
      <p class="kpi-value">{{ abiertos }}</p>
    </div>

    <div class="kpi-card kpi-resueltos">
      <h3 class="kpi-title">Tickets Resueltos</h3>
      <p class="kpi-value">{{ resueltos }}</p>
    </div>

  </div>

  <div class="contenedor-grafico">
    <h4 class="titulo-grafico">Distribucion de Estados</h4>
    
    <!--usamos la etiqueta de ngxchats-->
    <ngx-charts-pie-chart  
      [results]="datosGrafico"
      [scheme]="colorScheme"
      [labels]="true"
      [doughnut]="false">
    </ngx-charts-pie-chart>
  </div>
</div>
