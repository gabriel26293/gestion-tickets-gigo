<!--#DIR22 para dibujar el tablero/dashboard-->
<div style="background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
  <h2 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0;">
    📈 Dashboard Analitico
  </h2>

  <!-- Tarjetas de resumen rapido (KPIs) -->
  <div style="display: flex; gap: 20px; margin-bottom: 30px;">
    
    <div style="flex: 1; background-color: #34495e; color: white; padding: 20px; border-radius: 8px; text-align: center;">
      <h3 style="margin: 0; font-size: 1.2em; opacity: 0.9;">Total de Incidentes</h3>
      <p style="font-size: 2.5em; font-weight: bold; margin: 10px 0 0 0;">{{ totalTickets }}</p>
    </div>
    
    <div style="flex: 1; background-color: #e74c3c; color: white; padding: 20px; border-radius: 8px; text-align: center;">
      <h3 style="margin: 0; font-size: 1.2em; opacity: 0.9;">Tickets Abiertos</h3>
      <p style="font-size: 2.5em; font-weight: bold; margin: 10px 0 0 0;">{{ abiertos }}</p>
    </div>

    <div style="flex: 1; background-color: #2ecc71; color: white; padding: 20px; border-radius: 8px; text-align: center;">
      <h3 style="margin: 0; font-size: 1.2em; opacity: 0.9;">Tickets Resueltos</h3>
      <p style="font-size: 2.5em; font-weight: bold; margin: 10px 0 0 0;">{{ resueltos }}</p>
    </div>

  </div>

  <!-- Contenedor del Grafico de rTorta -->
  <div style="width: 100%; max-width: 400px; margin: 0 auto; padding-top: 20px;">
    <h4 style="text-align: center; color: #7f8c8d; margin-bottom: 20px;">Distribucion de Estados</h4>
    
    <canvas id="graficoEstados"></canvas><!-- aca es donde Chart.js va a dibujar -->
  </div>
</div>
